# ─────────────────────────────────────────────────────────────
#  Network Security Lab — course structure (single source of truth)
#
#  Everything is built from this file:
#    • ROADMAP.md          → python scripts/build_roadmap.py
#    • PR checks           → python scripts/validate.py
#    • the course PDF      → python scripts/build_pdf.py
#
#  Lesson file path = lessons/<phase-id>-<phase-slug>/<module-id>-<module-slug>/<lesson-id>-<lesson-slug>.md
#  Example:           lessons/01-networking-fundamentals/01-tcp-ip/01-what-is-an-ip-address.md
#
#  Rules:
#    • id   = two digits ("01", "02" ...). Order in this file = order in the course.
#    • slug = lowercase letters, numbers and "-" only.
#    • To add a lesson to the roadmap: add a line here, then run build_roadmap.py.
#    • A lesson is "done" when its .md file exists. No manual ticking needed.
# ─────────────────────────────────────────────────────────────

title: Network Security Lab
subtitle: Learn networking. Understand security. Think like a security engineer.

phases:
  - id: "00"
    slug: getting-started
    title: Getting Started
    modules:
      - id: "01"
        slug: introduction
        title: Introduction
        lessons:
          - { id: "01", slug: what-is-computer-networking, title: "What is computer networking?" }
          - { id: "02", slug: what-is-cybersecurity, title: "What is cybersecurity?" }
          - { id: "03", slug: what-is-ethical-hacking, title: "What is ethical hacking?" }
          - { id: "04", slug: security-vs-hacking, title: "Security vs hacking — what's the difference?" }
          - { id: "05", slug: legal-boundaries-and-disclosure, title: "Legal boundaries and responsible disclosure" }
      - id: "02"
        slug: lab-setup
        title: Lab Setup
        lessons:
          - { id: "01", slug: personal-learning-environment, title: "Setting up a personal learning environment" }
          - { id: "02", slug: virtual-machines, title: "Understanding virtual machines" }
          - { id: "03", slug: isolated-practice-network, title: "Building an isolated practice network" }

