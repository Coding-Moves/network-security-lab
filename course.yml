          - { id: "05", slug: subnet-masks, title: "Subnet masks" }
          - { id: "06", slug: cidr-notation, title: "CIDR notation" }
          - { id: "07", slug: default-gateways, title: "Default gateways" }
          - { id: "08", slug: tcp-vs-udp, title: "TCP vs UDP" }
          - { id: "09", slug: ports-and-sockets, title: "Ports and sockets" }
          - { id: "10", slug: osi-model, title: "The OSI model" }
          - { id: "11", slug: tcp-ip-model, title: "The TCP/IP model" }
