  - id: "03"
    slug: programming-for-security
    title: Programming for Security
    summary: "Python (basics, files, errors, sockets, HTTP requests, JSON/APIs, network automation) · JavaScript (browser basics, DOM, requests, browser security) · SQL (queries, joins, permissions, SQL injection concepts, parameterized queries)"
    modules: []

  - id: "04"
    slug: security-fundamentals
    title: Security Fundamentals
    summary: "CIA triad · threats, vulnerabilities and risk · attack surface · authentication vs authorization · MFA · access control · hashing vs encryption · symmetric and asymmetric crypto · digital signatures · certificates and PKI · patching · vulnerability management · least privilege · defense in depth"
    modules: []

  - id: "05"
    slug: reconnaissance
    title: Reconnaissance
    summary: "OSINT · passive vs active recon · domain and DNS research · WHOIS · subdomain enumeration concepts · network discovery · recording findings responsibly"
    modules: []

  - id: "06"
    slug: scanning-enumeration
    title: Scanning and Enumeration
    summary: "Host discovery · port scanning · TCP/UDP scans · service detection · Nmap · Netcat · directory enumeration · Gobuster · Nikto · false positives"
    note: "All scanning is done only on your own systems or authorized labs."
    modules: []

  - id: "07"
    slug: network-system-security
    title: Network and System Security
    summary: "Common attacks and defenses · packet sniffing · Wireshark · segmentation · Linux and Windows security · Active Directory basics · Wi-Fi security · SSH security · hardening · logging and monitoring"
    modules: []

  - id: "08"
    slug: web-security
    title: Web Security
    summary: "Cookies and sessions · same-origin policy · CORS · input validation · XSS · SQL injection · CSRF · broken access control · misconfiguration · file uploads · API security · Burp Suite · secure coding"
    note: "Follows the current OWASP Top 10."
    modules: []

  - id: "09"
