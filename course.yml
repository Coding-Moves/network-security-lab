    title: Vulnerability Assessment and Controlled Exploitation
    summary: "CVEs and CVSS · security advisories · exploit concepts · Metasploit basics · shells and payloads · safe proof-of-concept · privilege escalation basics · cleaning up labs"
    note: "Only on intentionally vulnerable machines or with explicit permission."
    modules: []

  - id: "10"
